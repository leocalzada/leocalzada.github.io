- title: "Nizanda -- Transformación ambiental y social en el istmo oaxaqueño"
  date: 2018-08-01
  description: "This visual narrative documents the socio-environmental transformations in Nizanda, Oaxaca, through community voices and photography. It highlights the local perspectives on development, renewable energy, and the cultural landscapes of the Isthmus of Tehuantepec, offering an intimate portrayal of resistance, change, and continuity in the face of large-scale infrastructure projects."
  location: Ediciones Quinto Sol, UNAM
