- title: "Amatlán -- Transformación ambiental y social en el norte de Morelos"
  date: 2018-08-01
  description: "This community-centered publication portrays the environmental and social transformations unfolding in Amatlán, Morelos. Through photography and local storytelling, it reflects on the relationship between territory, identity, and resistance in the face of extractive development and cultural change, drawing from the symbolic legacy of Quetzalcóatl."
  location: Ediciones Quinto Sol, UNAM
